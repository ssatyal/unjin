- title: "HP6/Umbrea, a rapidly evolving Drosophila HP1-family paralog, is a candidate HP1a-recruited plasticizer of heterochromatin"
  authors: "UnJin Lee†, Li Zhao†"
  venue: "bioRxiv"
  citation: "bioRxiv (2026)"
  year: 2026
  url: "https://www.biorxiv.org/content/10.64898/2026.08.24.746899v1"
  doi: "10.64898/2026.08.24.746899"
  image: "assets/img/biorxiv-hp6.jpg"
  pdf: "assets/pdf/biorxiv-hp6.pdf"
  project: "chelation"
  alt: "HP6/Umbrea figure: Drosophila phylogeny of the HP1b/HP6 duplication, HP1a versus HP6 domain architecture with predicted structures, and a molecular-dynamics snapshot of HP6 chains dispersed through an HP1a condensate"
  keywords: ["liquid-liquid phase condensates", "heterochromatin", "molecular dynamics"]
  type: preprint
  abstract: >-
    HP6/Umbrea is a fast-evolving Drosophila HP1 paralog that binds HP1a but cannot bind chromatin
    on its own. MD simulations show that HP6/Umbrea lowers dense-phase density inside HP1a
    condensates without shifting the phase-separation threshold, potentially operating as a
    "plasticizer" that may loosen heterochromatin and modulate silencing. Sequence analysis points
    to a recently evolved, constrained C-terminal tail underlying this role.

- title: "Naturally arising de novo open reading frames as potential zinc chelators in Drosophila melanogaster"
  authors: "UnJin Lee†"
  venue: "bioRxiv"
  citation: "bioRxiv (2026)"
  year: 2026
  url: "https://www.biorxiv.org/content/10.64898/2026.08.19.745823v1"
  doi: "10.64898/2026.08.19.745823"
  image: "assets/img/biorxiv-neorf.jpg"
  pdf: "assets/pdf/biorxiv-neorf.pdf"
  project: "chelation"
  alt: "De novo ORF figure: how (CA)n microsatellites translate into bis-histidine (H-x-H) zinc-coordination motifs, the ZMEG His32/His34/His36 site, and the distribution of H-x-H motif counts across de novo ORFs"
  keywords: ["transcriptional noise", "metalloproteins", "microsatellites", "de novo gene origination"]
  type: preprint
  abstract: >-
    Can brand-new (de novo) genes gain function without evolving complex binding partners? I show
    that thousands of segregating Drosophila de novo ORFs are enriched for bis-histidine (H-x-H)
    zinc-coordinating motifs, made when (CA) microsatellites translate into His-Thr-His repeats.
    Tracing ZMEG, a candidate zinc-binding ORF, from ancestral non-coding sequence, I argue that
    repeat expansion supplies a distributed class of candidate metal-binding peptides.

- title: "Machine learning for evolutionary genetics and molecular evolution"
  authors: "Nicolas Svetec, UnJin Lee, Li Zhao"
  venue: "Trends in Genetics"
  citation: "Trends in Genetics (2026)"
  year: 2026
  url: "https://doi.org/10.1016/j.tig.2026.01.013"
  doi: "10.1016/j.tig.2026.01.013"
  image: "assets/img/tig-ml.jpg"
  pdf: "assets/pdf/tig-ml.pdf"
  project: "ML/AI"
  alt: "Overview panels of machine-learning applications across evolutionary genetics: protein structure change, fitness landscapes, regulatory evolution, phylogenetic inference, demographic history, detecting selection, epistasis, genotype-to-phenotype mapping, and variant prediction"
  keywords: ["machine learning", "deep learning", "molecular evolution", "evolutionary genetics", "genotype-phenotype"]
  type: journal
  abstract: >-
    Machine learning, and deep learning in particular, is beginning to reshape evolutionary
    genetics and molecular evolution. This review surveys where ML now connects genotype,
    phenotype, and evolutionary history, from raw genetic variation to causal and multiomic
    approaches, and the challenges that remain.

- title: "Korean Natural Farming practices are dominated by a limited number of microbes and decrease fungal diversity"
  authors: "Candace Thompson, Shawn Mozeika, Elizabeth Paredes, UnJin Lee†"
  venue: "Sustainable Microbiology"
  citation: "Sustainable Microbiology (2026)"
  year: 2026
  url: "https://doi.org/10.1093/sumbio/qvag033"
  doi: "10.1093/sumbio/qvag033"
  image: "assets/img/knf.png"
  pdf: "assets/pdf/knf.pdf"
  project: "public outreach"
  alt: "Figure from the Korean Natural Farming study of indigenous-microorganism cultivation and its effect on microbial diversity"
  keywords: ["soil amendment", "metagenomic sequencing", "microbial dynamics"]
  type: journal
  abstract: >-
    Korean Natural Farming claims to cultivate and transfer beneficial "indigenous microorganisms"
    to soils, but the practice lacks validation. Using 16S and ITS sequencing across successive
    cultivation stages, we find the process is dominated by a few bacterial and fungal taxa and
    consistently reduces fungal diversity, contrary to its claimed benefit, though early cultures
    can capture and sustain bacterial diversity.

- title: "Comparative single-cell analysis of transcriptional bursting reveals the role of genome organization in de novo transcript origination"
  authors: "UnJin Lee, Cong Li, Christopher B. Langer, Nicolas Svetec, Li Zhao"
  venue: "PNAS"
  citation: "Proc. Natl. Acad. Sci. USA (2025)"
  year: 2025
  url: "https://doi.org/10.1073/pnas.2425618122"
  doi: "10.1073/pnas.2425618122"
  image: "assets/img/pnas-bursting.png"
  pdf: "assets/pdf/pnas-bursting.pdf"
  project: "cultivator"
  alt: "Figure from the comparative single-cell study of transcriptional bursting in Drosophila spermatogenesis"
  keywords: ["single-cell transcriptomics", "genome organization", "statistical methods", "transcriptional bursting", "de novo origination"]
  type: journal
  abstract: >-
    Comparing single-cell transcriptomes across three Drosophila species, we identify a core
    198-gene set that robustly labels spermatogenic cell types across 25-30 My of divergence.
    Using it, we show how transcriptional bursting evolves through spermatogenesis, including
    conserved reductions in X-linked bursting, providing support for the cultivator model in which
    newly evolved testis transcripts locally tune neighboring genes' bursting.

- title: "The three-dimensional genome drives the evolution of asymmetric gene duplicates via enhancer capture-divergence"
  authors: "UnJin Lee†*, Deanna Arsala*, Shengqian Xia*, Cong Li, Mujahid Ali, Nicolas Svetec, Christopher B. Langer, Débora R. Sobreira, Ittai Eres, Dylan Sosa, Jianhai Chen, Li Zhang, Patrick Reilly, Alexander Guzzetta, J.J. Emerson, Peter Andolfatto, Qi Zhou, Li Zhao, Manyuan Long†"
  venue: "Science Advances"
  citation: "Science Advances (2024)"
  year: 2024
  url: "https://doi.org/10.1126/sciadv.adn6625"
  doi: "10.1126/sciadv.adn6625"
  image: "assets/img/sciadv-3dgenome.png"
  pdf: "assets/pdf/sciadv-3dgenome.pdf"
  project: "enhancer capture"
  alt: "Figure from the study of enhancer capture and the 3D genome in asymmetric gene duplication"
  keywords: ["Hi-C", "RNAi", "genome organization", "gene regulation", "gene duplication", "evolutionary theory"]
  type: journal
  abstract: >-
    Duplicate-gene models have largely ignored genome architecture. We show distally duplicated
    genes can be regulated by co-opting pre-existing 3D contacts ("enhancer capture"), using the
    young gene HP6/Umbrea as a case study. It captured a hidden enhancer (FLEE1) inside the
    essential gene MFS18, highlighting how enhancer capture is a one-step, evolvable solution to
    Ohno's dilemma.

- title: "A Synergistic, Cultivator Model of De Novo Gene Origination"
  authors: "UnJin Lee, Shawn M. Mozeika, Li Zhao"
  venue: "Genome Biol. Evol."
  citation: "Genome Biol. Evol. (2024)"
  year: 2024
  url: "https://doi.org/10.1093/gbe/evae103"
  doi: "10.1093/gbe/evae103"
  image: "assets/img/gbe-cultivator.png"
  pdf: "assets/pdf/gbe-cultivator.pdf"
  project: "cultivator"
  alt: "Schematic of the cultivator model of de novo gene origination: selection on a cultivator gene, novel regulatory elements and putative de novo transcription, and paths to de novo gene birth through cis- and trans-regulation by a de novo lncRNA"
  keywords: ["evolvability", "non-coding RNA", "de novo origination", "evolutionary theory"]
  type: journal
  abstract: >-
    How do genes arising de novo from non-coding DNA fix and gain function, especially in large
    populations where drift is weak? We propose a regulation-focused "cultivator" model in which
    each step in a de novo gene's trajectory is driven by selectable benefits to neighboring
    cultivator genes rather than the new gene itself, placing genome organization at the center
    of new-gene evolution.

- title: "Evolution and maintenance of phenotypic plasticity"
  authors: "UnJin Lee†, Emily N. Mortola, Eun-jin Kim†, Manyuan Long"
  venue: "BioSystems"
  citation: "BioSystems (2022)"
  year: 2022
  url: "https://doi.org/10.1016/j.biosystems.2022.104791"
  doi: "10.1016/j.biosystems.2022.104791"
  image: "assets/img/biosystems-plasticity.jpg"
  pdf: "assets/pdf/biosystems-plasticity.pdf"
  project: "plasticity"
  alt: "Figure from the stochastic model of the evolution of phenotypic plasticity"
  keywords: ["phenotypic plasticity", "stochastic differential equations", "evolutionary theory"]
  type: journal
  abstract: >-
    We introduce a stochastic framework combining genetic and epigenetic contributions to
    phenotype to ask when plasticity evolves. Plasticity is favored transiently while adapting to
    new environments and erodes (canalizes) in stable ones, with selection choosing genic versus
    plastic routes by relative mutation rates, highlighting genetic conflict as a determinant of
    the long-term maintenance of phenotypic plasticity.

- title: "Genomic analyses of new genes and their phenotypic effects reveal rapid evolution of essential functions in Drosophila development"
  authors: "Shengqian Xia, Nicholas W. VanKuren, Chunyan Chen, Li Zhang, Claus Kemkemer, Yi Shao, Hangxing Jia, UnJin Lee, Alexander S. Advani, Andrea Gschwend, Maria D. Vibranovski, Sidi Chen, Yong E. Zhang, Manyuan Long"
  venue: "PLOS Genetics"
  citation: "PLOS Genetics (2021)"
  year: 2021
  url: "https://doi.org/10.1371/journal.pgen.1009654"
  doi: "10.1371/journal.pgen.1009654"
  image: "assets/img/plosgen-newgenes.png"
  pdf: "assets/pdf/plosgen-newgenes.pdf"
  project: "new genes"
  alt: "Figure from the genomic analysis of new-gene essentiality in Drosophila development"
  keywords: ["new genes", "gene essentiality", "Drosophila development", "RNAi knockdown", "functional evolution"]
  type: journal
  abstract: >-
    Are recently evolved genes dispensable? Knocking down 11,354 Drosophila genes, including 702
    young ones (&lt; 40 My), we find a similarly high proportion (~32%) essential among new and
    old alike, highlighting how new genes rapidly evolve essential developmental functions.

- title: "Topological evolution of coexpression networks by new gene integration maintains the hierarchical and modular structures in human ancestors"
  authors: "Jian Zu, Yuexi Gu, Yu Li, Chentong Li, Wenyu Zhang, Yong E. Zhang, UnJin Lee, Li Zhang, Manyuan Long"
  venue: "Sci China Life Sci"
  citation: "Science China Life Sciences (2019)"
  year: 2019
  url: "https://doi.org/10.1007/s11427-019-9483-6"
  doi: "10.1007/s11427-019-9483-6"
  image: "assets/img/scls-topological.png"
  pdf: "assets/pdf/scls-topological.pdf"
  project: "new genes"
  alt: "Figure from the analysis of coexpression-network evolution driven by new-gene integration"
  keywords: ["gene coexpression networks", "network evolution", "new gene integration", "systems biology"]
  type: journal
  abstract: >-
    We analyze how integrating newly evolved genes reshapes human gene coexpression networks.
    Younger genes are more clustered and increasingly hierarchical, gaining connections through
    a "rich-gets-richer" process driven by duplication and orphan-gene origination. Despite
    continual new-gene integration, the network preserves its hierarchical, modular structure
    over evolutionary time.

- title: "The cyanobacterial circadian clock follows midday in vivo and in vitro"
  authors: "Eugene Leypunskiy, Jenny Lin, Haneul Yoo, UnJin Lee, Aaron R. Dinner, Michael J. Rust"
  venue: "eLife"
  citation: "eLife (2017)"
  year: 2017
  url: "https://doi.org/10.7554/eLife.23539"
  doi: "10.7554/eLife.23539"
  image: "assets/img/elife-cyano.png"
  pdf: "assets/pdf/elife-cyano.pdf"
  project: "circadian rhythm"
  alt: "Figure from the study of the cyanobacterial circadian clock tracking midday across day lengths"
  keywords: ["circadian clock", "cyanobacteria", "entrainment"]
  type: journal
  abstract: >-
    How do circadian clocks lock onto daily cycles whose length changes with the seasons? Driving
    the cyanobacterial clock in vivo and in vitro, we find its phase follows a simple scaling law
    that tracks midday, intrinsic to the minimal KaiABC protein system. This framework based on
    cue-driven phase shifts can thus predict clock behavior across many environments.

- title: "Geometric structure and geodesic in a solvable model of nonequilibrium process"
  authors: "Eun-jin Kim, UnJin Lee, James Heseltine, Rainer Hollerbach"
  venue: "Phys Rev E"
  citation: "Phys. Rev. E (2016)"
  year: 2016
  url: "https://doi.org/10.1103/PhysRevE.93.062127"
  doi: "10.1103/PhysRevE.93.062127"
  image: "assets/img/pre-geodesic.png"
  pdf: "assets/pdf/pre-geodesic.pdf"
  project: "plasticity"
  alt: "Figure from the solvable nonequilibrium model of geometric structure and geodesics"
  keywords: ["nonequilibrium statistical mechanics", "information geometry", "stochastic processes"]
  type: journal
  abstract: >-
    Using an exactly solvable driven-dissipative model, we study nonequilibrium dynamics via
    information length. We find geodesics along which information moves at constant speed, giving
    optimal paths that minimize time and dissipated energy, and show small periodic modulations
    can control a stochastic growth model.

