- title: "Machine learning for evolutionary genetics and molecular evolution"
  authors: "Nicolas Svetec, UnJin Lee, Li Zhao"
  venue: "Trends in Genetics"
  citation: "Trends in Genetics 42(5):423–433 (2026)"
  year: 2026
  url: "https://doi.org/10.1016/j.tig.2026.01.013"
  doi: "10.1016/j.tig.2026.01.013"
  image: "assets/img/tig-ml.svg"
  type: journal
  abstract: >-
    Over the past decade, the rapid expansion of large-scale data and advances in
    computational power have allowed machine learning (ML), especially deep learning,
    to reshape many areas of biological research. Evolutionary genetics and molecular
    evolution are also poised for a similar transformation. In this review, we discuss
    key advances and ongoing challenges in applying ML to the study of genetics and
    evolution, and we highlight the potential of artificial intelligence to connect
    genotype, phenotype, and evolutionary history.
  highlights:
    - "Recent advances in machine learning (ML) especially deep learning have enabled breakthroughs in biology and are poised to play an important role in evolutionary biology."
    - "ML models are increasingly capable of connecting genetic variation to molecular function, integrating structural, regulatory, and phenotypic data at multiple scales."
    - "ML models can now be used directly on raw SNPs, haplotypes, or allele frequency spectra, reducing reliance on summary statistics and enabling the discovery of previously unrecognized evolutionary patterns."
    - "Emerging approaches move beyond correlation, using causal inference to generate mechanistic insights into evolutionary processes."
    - "Integrating multiomics data through ML is revealing hidden layers of complexity, such as epistasis, regulatory evolution, and phenotypic plasticity, that shape adaptation and diversification."

- title: "Korean Natural Farming practices are dominated by a limited number of microbes and decrease fungal diversity"
  authors: "Candace Thompson, Shawn Mozeika, Elizabeth Paredes, UnJin Lee†"
  venue: "Sustainable Microbiology"
  citation: "Sustainable Microbiology 3(3):qvag033 (2026)"
  year: 2026
  url: "https://doi.org/10.1093/sumbio/qvag033"
  doi: "10.1093/sumbio/qvag033"
  image: "assets/img/knf.png"
  keywords: ["soil amendment", "metagenomic sequencing", "microbial dynamics"]
  type: journal
  abstract: >-
    Korean Natural Farming (KNF) practices claim to cultivate and transfer 'indigenous
    microorganisms (IMOs)' to donor soils as a method of probiotic soil enhancement. We
    investigated whether IMO cultivation can propagate unique microbiomes and maintain
    microbial diversity through successive IMO stages for restoration of flood contaminated
    soils. Employing a balanced study design using soil samples from salt marsh, deciduous
    forest, and urban greenspace (plus sterilized controls), samples underwent the first two
    IMO cultivation steps followed by 16S rRNA and ITS metagenomic sequencing. Notably, IMO
    cultivation was dominated by limited bacterial taxa (Enterobacterales, Pseudomonadales,
    Bacillales) and fungal taxa (Rhizopodaceae, particularly R. oryzae). While bacterial
    diversity was maintained or increased during two IMO stages, fungal diversity consistently
    decreased. Principal Coordinates Analysis also revealed distinct clustering by inoculum
    source (i.e. human-altered, human-transported vs. natural vs. sterile) that persisted
    throughout cultivation. Our evidence suggests that the IMO process enriches for specific
    taxa likely adapted to cultivated conditions and fails to maintain fungal diversity,
    contrasting greatly with KNF's proposed benefit of propagating locale-specific,
    fungal-dominated indigenous microbiomes. However, our results demonstrate that early IMO
    cultures may capture and sustain bacterial diversity in soil, opening the door for future
    studies of KNF efficacy and sustainability.

- title: "HP6/Umbrea, a rapidly evolving Drosophila HP1-family paralog, is a candidate HP1a-recruited plasticizer of heterochromatin"
  authors: "UnJin Lee†, Li Zhao†"
  venue: "bioRxiv"
  citation: "bioRxiv preprint (2026)"
  year: 2026
  url: "https://www.biorxiv.org/content/10.64898/2026.08.24.746899v1"
  doi: "10.64898/2026.08.24.746899"
  image: "assets/img/biorxiv-hp6.svg"
  keywords: ["liquid-liquid phase condensates", "heterochromatin", "molecular dynamics"]
  type: preprint
  abstract: >-
    HP6/Umbrea, a rapidly evolving Drosophila HP1-family paralog, functions as an
    HP1a-recruited plasticizer of heterochromatin. The protein lacks independent
    chromatin-binding capacity but binds HP1a directly. Molecular dynamics simulations
    reveal that when incorporated into HP1a condensates, HP6/Umbrea lowers dense-phase
    density without altering phase-separation thresholds. These findings suggest a spacer
    function that may increase transcriptional machinery permeability, potentially
    modulating heterochromatic silencing through a position effect-variegation mechanism.
    Comparative sequence analysis indicates the C-terminal tail represents a recently
    evolved, purifying-selection-constrained feature consistent with this condensate
    plasticizer function.

- title: "Naturally arising de novo open reading frames as potential zinc chelators in Drosophila melanogaster"
  authors: "UnJin Lee†"
  venue: "bioRxiv"
  citation: "bioRxiv preprint (2026)"
  year: 2026
  url: "https://www.biorxiv.org/content/10.64898/2026.08.19.745823v1"
  doi: "10.64898/2026.08.19.745823"
  image: "assets/img/biorxiv-neorf.svg"
  keywords: ["transcriptional noise", "metalloproteins", "microsatellites", "de novo gene origination"]
  type: preprint
  abstract: >-
    A central open problem in the study of de novo gene origination is that the molecular
    mechanisms and functions driving the emergence of such evolutionarily young, de novo
    protein-coding genes remain poorly understood. Metal chelation, a simple, directly
    selectable activity that both requires no specific interaction partners and is also
    compatible with intrinsic disorder, is one possible function. This possibility was tested
    using sequence signatures in 7,849 transcriptionally supported, still-segregating
    Drosophila melanogaster de novo open reading frames. Interestingly, these new open reading
    frames (neORFs) are enriched for bis-histidine motifs at the metal-coordination-competent
    spacings H-x-H and H-x-x-x-H and show no enrichment at the incompatible even spacings
    relative to repeat-masked intergenic ORFs. Notably, these neORFs were also found to lack
    the C-x-x-C grammar of canonical metal-binding proteins. I report that this H-x-H
    bis-histidine signal is generated by translation of (CA) microsatellites into His-Thr-His
    in Drosophila melanogaster, as evidenced by a CAC-codon bias within H-x-H motifs and a
    fourfold threonine enrichment at the central position. I propose that recurrent
    microsatellite expansion supplies Drosophila with a distributed, independently originated
    class of candidate metal-binding de novo peptides. I then trace one neORF (ZMEG) from
    conserved ancestral non-coding sequence to a transcribed, melanogaster-lineage open reading
    frame whose (CA)9-derived His run presents a candidate His32-His36 bis-histidine site. I
    propose that such de novo proteins may constitute a class of molecules united not by common
    descent but by their shared origin in evolvable repeat sequence, highlighting the importance
    of emergence bias in molecular evolution.

- title: "Comparative single-cell analysis of transcriptional bursting reveals the role of genome organization in de novo transcript origination"
  authors: "UnJin Lee, Cong Li, Christopher B. Langer, Nicolas Svetec, Li Zhao"
  venue: "PNAS"
  citation: "Proc. Natl. Acad. Sci. USA 122(18):e2425618122 (2025)"
  year: 2025
  url: "https://doi.org/10.1073/pnas.2425618122"
  doi: "10.1073/pnas.2425618122"
  image: "assets/img/pnas-bursting.png"
  keywords: ["single-cell transcriptomics", "genome organization", "statistical methods", "transcriptional bursting", "de novo origination"]
  type: journal
  abstract: >-
    Spermatogenesis is a key developmental process underlying the origination of newly evolved
    genes. However, rapid cell type-specific transcriptomic divergence of the Drosophila germline
    has posed a significant technical barrier for comparative single-cell RNA-sequencing studies.
    By quantifying a surprisingly strong correlation between species- and cell type-specific
    divergence in three closely related Drosophila species, we apply a statistical procedure to
    identify a core set of 198 genes that are highly predictive of cell type identity while
    remaining robust to species-specific differences that span over 25 to 30 My of evolution. We
    then utilize cell type classifications based on the 198-gene set to show how transcriptional
    divergence in cell type increases throughout spermatogenic developmental time. After validating
    these cross-species cell type classifications using RNA fluorescence in situ hybridization and
    imaging, we then investigate the influence of genome organization on the molecular evolution of
    spermatogenesis vis-a-vis transcriptional bursting. We first show altering transcriptional burst
    size contributes to premeiotic transcription and altering bursting frequency contributes to
    postmeiotic expression. We then report global differences in autosomal vs. X chromosomal
    transcription may arise in a developmental stage preceding full testis organogenesis by showing
    evolutionarily conserved decreases in X-linked transcription bursting kinetics in all examined
    somatic and germline cell types. Finally, we provide evidence supporting the cultivator model of
    de novo gene origination by demonstrating how the appearance of newly evolved testis-specific
    transcripts potentially provides short-range regulation of neighboring genes' transcriptional
    bursting properties during key stages of spermatogenesis.

- title: "The three-dimensional genome drives the evolution of asymmetric gene duplicates via enhancer capture-divergence"
  authors: "UnJin Lee†*, Deanna Arsala*, Shengqian Xia*, Cong Li, Mujahid Ali, Nicolas Svetec, Christopher B. Langer, Débora R. Sobreira, Ittai Eres, Dylan Sosa, Jianhai Chen, Li Zhang, Patrick Reilly, Alexander Guzzetta, J.J. Emerson, Peter Andolfatto, Qi Zhou, Li Zhao, Manyuan Long†"
  venue: "Science Advances"
  citation: "Science Advances 10(51):eadn6625 (2024)"
  year: 2024
  url: "https://doi.org/10.1126/sciadv.adn6625"
  doi: "10.1126/sciadv.adn6625"
  image: "assets/img/sciadv-3dgenome.png"
  keywords: ["Hi-C", "RNAi", "genome organization", "gene regulation", "gene duplication", "evolutionary theory"]
  type: journal
  abstract: >-
    Previous evolutionary models of duplicate gene evolution have overlooked the pivotal role of
    genome architecture. Here, we show that proximity-based regulatory recruitment by distally
    duplicated genes is an efficient mechanism for modulating tissue-specific production of
    preexisting proteins. By leveraging genomic asymmetries, we performed a coexpression analysis on
    Drosophila melanogaster tissue data to show the generality of enhancer capture-divergence (ECD)
    as a significant evolutionary driver of asymmetric, distally duplicated genes. We use the recently
    evolved gene HP6/Umbrea as an example of the ECD process. By assaying genome-wide chromosomal
    conformations in multiple Drosophila species, we show that HP6/Umbrea was inserted near a
    preexisting, long-distance three-dimensional genomic interaction. We then use this data to identify
    a newly found enhancer (FLEE1), buried within the coding region of the highly conserved, essential
    gene MFS18, that likely neofunctionalized HP6/Umbrea. Last, we demonstrate ancestral transcriptional
    coregulation of HP6/Umbrea's future insertion site, illustrating how enhancer capture provides a
    highly evolvable, one-step solution to Ohno's dilemma.

- title: "A Synergistic, Cultivator Model of De Novo Gene Origination"
  authors: "UnJin Lee, Shawn M. Mozeika, Li Zhao"
  venue: "Genome Biol. Evol."
  citation: "Genome Biol. Evol. 16(6):evae103 (2024)"
  year: 2024
  url: "https://doi.org/10.1093/gbe/evae103"
  doi: "10.1093/gbe/evae103"
  image: "assets/img/gbe-cultivator.png"
  keywords: ["evolvability", "non-coding RNA", "de novo origination", "evolutionary theory"]
  type: journal
  abstract: >-
    The origin and fixation of evolutionarily young genes is a fundamental question in evolutionary
    biology. However, understanding the origins of newly evolved genes arising de novo from noncoding
    genomic sequences is challenging. This is partly due to the low likelihood that several neutral or
    nearly neutral mutations fix prior to the appearance of an important novel molecular function. This
    issue is particularly exacerbated in large effective population sizes where the effect of drift is
    small. To address this problem, we propose a regulation-focused, cultivator model for de novo gene
    evolution. This cultivator-focused model posits that each step in a novel variant's evolutionary
    trajectory is driven by well-defined, selectively advantageous functions for the cultivator genes,
    rather than solely by the de novo genes, emphasizing the critical role of genome organization in the
    evolution of new genes.

- title: "Evolution and maintenance of phenotypic plasticity"
  authors: "UnJin Lee†, Emily N. Mortola, Eun-jin Kim†, Manyuan Long"
  venue: "BioSystems"
  citation: "BioSystems 222:104791 (2022)"
  year: 2022
  url: "https://doi.org/10.1016/j.biosystems.2022.104791"
  doi: "10.1016/j.biosystems.2022.104791"
  image: "assets/img/biosystems-plasticity.jpg"
  keywords: ["phenotypic plasticity", "stochastic differential equations", "evolutionary theory"]
  type: journal
  abstract: >-
    We introduce a novel framework for exploring the evolutionary consequences of phenotypic plasticity
    (adaptive and non-adaptive) integrating both genic and epigenetic effects on phenotype via stochastic
    differential equations and in-silico selection. In accordance with the most significant results derived
    from prior models, we demonstrate how plasticity is differentially favored when subjected to small vs
    large environmental shifts, how plasticity is transiently favorable while accommodating a new
    environment, and how plasticity decreases during epochs where the environment remains stable
    (canalization). In contrast to these models, however, by allowing the same phenotypic value to be
    produced via two different paths, i.e. deterministic, genic, vs stochastic, epigenetic mechanisms, we
    demonstrate when genic contributions alone cannot produce an optimal phenotype, plastic, epigenetic
    contributions will instead fully accommodate new environments, allowing for both adaptive and
    non-adaptive plasticity to evolve. Furthermore, we show that while rates of phenotypic accommodation are
    relatively constant under a wide range of selective conditions, selection will favor the most efficient
    route to adaptation: deterministic, genic response, or stochastic, plastic response. As a result,
    plasticity may evolve or canalization may occur within a given epoch depending on the relative mutation
    rate of genic and epigenetic contributions to phenotype, highlighting the importance of genetic conflict
    on the evolution of plasticity.

- title: "Genomic analyses of new genes and their phenotypic effects reveal rapid evolution of essential functions in Drosophila development"
  authors: "Shengqian Xia, Nicholas W. VanKuren, Chunyan Chen, Li Zhang, Claus Kemkemer, Yi Shao, Hangxing Jia, UnJin Lee, Alexander S. Advani, Andrea Gschwend, Maria D. Vibranovski, Sidi Chen, Yong E. Zhang, Manyuan Long"
  venue: "PLOS Genetics"
  citation: "PLOS Genetics 17(7):e1009654 (2021)"
  year: 2021
  url: "https://doi.org/10.1371/journal.pgen.1009654"
  doi: "10.1371/journal.pgen.1009654"
  image: "assets/img/plosgen-newgenes.png"
  type: journal
  abstract: >-
    It is a conventionally held dogma that the genetic basis underlying development is conserved in a long
    evolutionary time scale. Ample experiments based on mutational, biochemical, functional, and
    complementary knockdown/knockout approaches have revealed the unexpectedly important role of recently
    evolved new genes in the development of Drosophila. The recent progress in the genome-wide experimental
    testing of gene effects and improvements in the computational identification of new genes (&lt; 40 million
    years ago, Mya) open the door to investigate the evolution of gene essentiality with a phylogenetically
    high resolution. These advancements also raised interesting issues in techniques and concepts related to
    phenotypic effect analyses of genes, particularly of those that recently originated. Here we reported our
    analyses of these issues, including reproducibility and efficiency of knockdown experiment and difference
    between RNAi libraries in the knockdown efficiency and testing of phenotypic effects. We further analyzed
    a large data from knockdowns of 11,354 genes (~75% of the Drosophila melanogaster total genes), including
    702 new genes (~66% of the species total new genes that aged &lt; 40 Mya), revealing a similarly high
    proportion (~32.2%) of essential genes that originated in various Sophophora subgenus lineages and distant
    ancestors beyond the Drosophila genus. The transcriptional compensation effect from CRISPR knockout were
    detected for highly similar duplicate copies. Knockout of a few young genes detected analogous essentiality
    in various functions in development. Taken together, our experimental and computational analyses provide
    valuable data for detection of phenotypic effects of genes in general and further strong evidence for the
    concept that new genes in Drosophila quickly evolved essential functions in viability during development.

- title: "Topological evolution of coexpression networks by new gene integration maintains the hierarchical and modular structures in human ancestors"
  authors: "Jian Zu, Yuexi Gu, Yu Li, Chentong Li, Wenyu Zhang, Yong E. Zhang, UnJin Lee, Li Zhang, Manyuan Long"
  venue: "Sci China Life Sci"
  citation: "Science China Life Sciences 62(4):594–608 (2019)"
  year: 2019
  url: "https://doi.org/10.1007/s11427-019-9483-6"
  doi: "10.1007/s11427-019-9483-6"
  image: "assets/img/scls-topological.png"
  type: journal
  abstract: >-
    We analyze the global structure and evolution of human gene coexpression networks driven by new gene
    integration. When the Pearson correlation coefficient is greater than or equal to 0.5, we find that the
    coexpression network consists of 334 small components and one "giant" connected subnet comprising of 6317
    interacting genes. This network shows the properties of power-law degree distribution and small-world. The
    average clustering coefficient of younger genes is larger than that of the elderly genes (0.6685 vs. 0.5762).
    Particularly, we find that the younger genes with a larger degree also show a property of hierarchical
    architecture. The younger genes play an important role in the overall pivotability of the network and this
    network contains few redundant duplicate genes. Moreover, we find that gene duplication and orphan genes are
    two dominant evolutionary forces in shaping this network. Both the duplicate genes and orphan genes develop
    new links through a "rich-gets-richer" mechanism. With the gradual integration of new genes into the ancestral
    network, most of the topological structure features of the network would gradually increase. However, the
    exponent of degree distribution and modularity coefficient of the whole network do not change significantly,
    which implies that the evolution of coexpression networks maintains the hierarchical and modular structures in
    human ancestors.

- title: "The cyanobacterial circadian clock follows midday in vivo and in vitro"
  authors: "Eugene Leypunskiy, Jenny Lin, Haneul Yoo, UnJin Lee, Aaron R. Dinner, Michael J. Rust"
  venue: "eLife"
  citation: "eLife 6:e23539 (2017)"
  year: 2017
  url: "https://doi.org/10.7554/eLife.23539"
  doi: "10.7554/eLife.23539"
  image: "assets/img/elife-cyano.png"
  type: journal
  abstract: >-
    Circadian rhythms are biological oscillations that schedule daily changes in physiology. Outside the
    laboratory, circadian clocks do not generally free-run but are driven by daily cues whose timing varies with
    the seasons. The principles that determine how circadian clocks align to these external cycles are not well
    understood. Here, we report experimental platforms for driving the cyanobacterial circadian clock both in vivo
    and in vitro. We find that the phase of the circadian rhythm follows a simple scaling law in light-dark cycles,
    tracking midday across conditions with variable day length. The core biochemical oscillator comprised of the
    Kai proteins behaves similarly when driven by metabolic pulses in vitro, indicating that such dynamics are
    intrinsic to these proteins. We develop a general mathematical framework based on instantaneous transformation
    of the clock cycle by external cues, which successfully predicts clock behavior under many cycling environments.

- title: "Geometric structure and geodesic in a solvable model of nonequilibrium process"
  authors: "Eun-jin Kim, UnJin Lee, James Heseltine, Rainer Hollerbach"
  venue: "Phys Rev E"
  citation: "Phys. Rev. E 93(6):062127 (2016)"
  year: 2016
  url: "https://doi.org/10.1103/PhysRevE.93.062127"
  doi: "10.1103/PhysRevE.93.062127"
  image: "assets/img/pre-geodesic.png"
  type: journal
  abstract: >-
    We investigate the geometric structure of a nonequilibrium process and its geodesic solutions. By employing an
    exactly solvable model of a driven dissipative system (generalized nonautonomous Ornstein-Uhlenbeck process), we
    compute the time-dependent probability density functions (PDFs) and investigate the evolution of this system in a
    statistical metric space where the distance between two points (the so-called information length) quantifies the
    change in information along a trajectory of the PDFs. In this metric space, we find a geodesic for which the
    information propagates at constant speed, and demonstrate its utility as an optimal path to reduce the total time
    and total dissipated energy. In particular, through examples of physical realizations of such geodesic solutions
    satisfying boundary conditions, we present a resonance phenomenon in the geodesic solution and the discretization
    into cyclic geodesic solutions. Implications for controlling population growth are further discussed in a stochastic
    logistic model, where a periodic modulation of the diffusion coefficient and the deterministic force by a small
    amount is shown to have a significant controlling effect.

- title: "Prognostic and predictive breast cancer signature"
  authors: "Marsha Rosner, Miao Sun, UnJin Lee"
  venue: "USPTO"
  citation: "US Patent Application US 2016/0078167 A1 (2016)"
  year: 2016
  url: "https://patents.google.com/patent/US20160078167A1/en"
