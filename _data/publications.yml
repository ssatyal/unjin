- title: "Noise-Driven Phenotypic Heterogeneity with Finite Correlation Time in Clonal Populations"
  authors: "UnJin Lee†, John J. Skinner, John Reinitz, Marsha Rich Rosner, Eun-jin Kim†"
  venue: "PLOS ONE"
  citation: "PLOS ONE (2015)"
  year: 2015
  url: "https://doi.org/10.1371/journal.pone.0132397"
  doi: "10.1371/journal.pone.0132397"
  image: "assets/img/plosone-noise.png"
  pdf: "assets/pdf/plosone-noise.pdf"
  project: "plasticity"
  alt: "Figure from the model of noise-driven phenotypic heterogeneity in clonal populations"
  keywords: ["phenotypic plasticity", "stochastic differential equations", "evolution of treatment resistance"]
  type: journal
  abstract: >-
    Genetically identical clonal cells can still diverge phenotypically, with consequences from
    bet-hedging to drug resistance. Using stochastic models with finite correlation time, we show
    how noisy growth and loss of self-regulation shift populations from bounded to unbounded
    growth, and how variance, not just the mean, shapes phenotype.

- title: "A Prognostic Gene Signature for Metastasis-Free Survival of Triple Negative Breast Cancer Patients"
  authors: "UnJin Lee*, Casey Frankenberger*, Jieun Yun, Elena Bevilacqua, Carlos Caldas, Suet-Feung Chin, Oscar M. Rueda, John Reinitz, Marsha Rich Rosner"
  venue: "PLOS ONE"
  citation: "PLOS ONE (2013)"
  year: 2013
  url: "https://doi.org/10.1371/journal.pone.0082125"
  doi: "10.1371/journal.pone.0082125"
  image: "assets/img/plosone-tnbc.png"
  pdf: "assets/pdf/plosone-tnbc.pdf"
  project: "ML/AI"
  alt: "Figure from the triple-negative breast cancer prognostic gene-signature study"
  keywords: ["machine learning", "triple-negative breast cancer", "patient prognosis", "survival analysis"]
  type: journal
  abstract: >-
    Triple-negative breast cancers are aggressive, lack targeted therapies, and are hard to
    stratify. We built a 30-gene BACH1 Pathway Metastasis Signature (BPMS) that selectively
    predicts metastasis-free survival in basal-like/TNBC patients and refines risk beyond
    existing clinical tests. It works as a single-sample predictor and nominates BACH1-pathway
    genes as therapeutic targets.
