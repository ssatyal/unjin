- title: "Noise-Driven Phenotypic Heterogeneity with Finite Correlation Time in Clonal Populations"
  authors: "UnJin Lee†, John J. Skinner, John Reinitz, Marsha Rich Rosner, Eun-Jin Kim†"
  venue: "PLOS ONE"
  citation: "PLOS ONE 10(7):e0132397 (2015)"
  year: 2015
  url: "https://doi.org/10.1371/journal.pone.0132397"
  doi: "10.1371/journal.pone.0132397"
  image: "assets/img/plosone-noise.png"
  keywords: ["phenotypic plasticity", "stochastic differential equations", "evolution of treatment resistance"]
  type: journal
  abstract: >-
    There has been increasing awareness in the wider biological community of the role of clonal phenotypic
    heterogeneity in playing key roles in phenomena such as cellular bet-hedging and decision making, as in the case of
    the phage-λ lysis/lysogeny and B. Subtilis competence/vegetative pathways. Here, we report on the effect of
    stochasticity in growth rate, cellular memory/intermittency, and its relation to phenotypic heterogeneity. We first
    present a linear stochastic differential model with finite auto-correlation time, where a randomly fluctuating growth
    rate with a negative average is shown to result in exponential growth for sufficiently large fluctuations in growth
    rate. We then present a non-linear stochastic self-regulation model where the loss of coherent self-regulation and an
    increase in noise can induce a shift from bounded to unbounded growth. An important consequence of these models is
    that while the average change in phenotype may not differ for various parameter sets, the variance of the resulting
    distributions may considerably change. This demonstrates the necessity of understanding the influence of variance and
    heterogeneity within seemingly identical clonal populations, while providing a mechanism for varying functional
    consequences of such heterogeneity. Our results highlight the importance of a paradigm shift from a deterministic to a
    probabilistic view of clonality in understanding selection as an optimization problem on noise-driven processes,
    resulting in a wide range of biological implications, from robustness to environmental stress to the development of
    drug resistance.

- title: "A Prognostic Gene Signature for Metastasis-Free Survival of Triple Negative Breast Cancer Patients"
  authors: "UnJin Lee*, Casey Frankenberger*, Jieun Yun, Elena Bevilacqua, Carlos Caldas, Suet-Feung Chin, Oscar M. Rueda, John Reinitz, Marsha Rich Rosner"
  venue: "PLOS ONE"
  citation: "PLOS ONE 8(12):e82125 (2013)"
  year: 2013
  url: "https://doi.org/10.1371/journal.pone.0082125"
  doi: "10.1371/journal.pone.0082125"
  image: "assets/img/plosone-tnbc.png"
  keywords: ["machine learning", "triple-negative breast cancer", "patient prognosis", "survival analysis"]
  type: journal
  abstract: >-
    Although triple negative breast cancers (TNBC) are the most aggressive subtype of breast cancer, they currently lack
    targeted therapies. Because this classification still includes a heterogeneous collection of tumors, new tools to
    classify TNBCs are urgently required in order to improve our prognostic capability for high risk patients and predict
    response to therapy. We previously defined a gene expression signature, RKIP Pathway Metastasis Signature (RPMS), based
    upon a metastasis-suppressive signaling pathway initiated by Raf Kinase Inhibitory Protein (RKIP). We have now generated
    a new BACH1 Pathway Metastasis gene signature (BPMS) that utilizes targets of the metastasis regulator BACH1.
    Specifically, we substituted experimentally validated target genes to generate a new BACH1 metagene, developed an
    approach to optimize patient tumor stratification, and reduced the number of signature genes to 30. The BPMS
    significantly and selectively stratified metastasis-free survival in basal-like and, in particular, TNBC patients. In
    addition, the BPMS further stratified patients identified as having a good or poor prognosis by other signatures
    including the Mammaprint and Oncotype clinical tests. The BPMS is thus complementary to existing signatures and is a
    prognostic tool for high risk ER-HER2- patients. We also demonstrate the potential clinical applicability of the BPMS as
    a single sample predictor. Together, these results reveal the potential of this pathway-based BPMS gene signature to
    identify high risk TNBC patients that can respond effectively to targeted therapy, and highlight BPMS genes as novel drug
    targets for therapeutic development.
