# GitHub Pages / Jekyll configuration for unjinlee.com
#
# This file mostly tells the Jekyll build what to ignore. The site itself is
# plain HTML + a data file (_data/publications.yml); there is no theme.

title: UnJin Lee
description: Academic homepage of UnJin Lee, evolutionary geneticist.

# Keep dev-only files out of the build. NOTE: `exclude` removes files from the
# built SITE, so it must NOT list the vendored css/js the pages actually load.
exclude:
  - readme.md

# No plugins are required; publications render from _data via a Liquid loop in index.html.
